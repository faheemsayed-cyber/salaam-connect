<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>As-Salaam Connect | School Portal</title>
<style>
:root{--green:#183d32;--green2:#245444;--gold:#b89552;--cream:#f7f4ec;--paper:#fffefa;--ink:#26352f;--muted:#78837d;--line:#e8e4da;--soft:#eef2ed;--shadow:0 12px 35px #203b2d12}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--green);color:#f8f5ec;padding:26px 17px;display:flex;flex-direction:column;gap:25px;flex-shrink:0}.brand{display:flex;gap:12px;align-items:center;padding:0 8px}.mark{width:43px;height:43px;border:1px solid #c9ad73;border-radius:14px;display:grid;place-items:center;color:#e1c68d;font-size:23px}.brand strong{display:block;font-size:15px;letter-spacing:.3px}.brand small{color:#c8d2ca;font-size:11px}.navlabel{color:#aebeb3;text-transform:uppercase;font-size:10px;letter-spacing:1.5px;padding:0 12px;margin:4px 0}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#e4eae5;text-align:left;padding:11px 13px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#ffffff18;color:#f2d79e}.nav .ico{width:20px;text-align:center}.sidebottom{margin-top:auto;border-top:1px solid #ffffff25;padding:16px 10px;color:#c5d0c8;font-size:12px}.main{min-width:0;flex:1}.topbar{height:75px;background:#fffefa;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.crumb{color:var(--muted);font-size:13px}.topright{display:flex;align-items:center;gap:13px}.role{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:white;color:var(--green)}.avatar{background:#e9dfc9;color:var(--green);width:37px;height:37px;border-radius:50%;display:grid;place-items:center;font-weight:700}.content{max-width:1250px;margin:auto;padding:32px}.welcome{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:25px}.eyebrow{color:var(--gold);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:10px}.welcome h1{font-family:Georgia,serif;font-size:32px;color:var(--green);font-weight:500;margin:5px 0}.welcome p{color:var(--muted);margin:0}.date{font-size:12px;color:var(--muted);background:#fffefa;border:1px solid var(--line);padding:9px 13px;border-radius:9px}.grid{display:grid;gap:17px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:var(--shadow)}.stat{display:flex;justify-content:space-between;align-items:flex-start}.stat .symbol{background:var(--soft);color:var(--green);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:18px}.stat strong{display:block;font-size:27px;color:var(--green);margin-top:10px}.stat span{font-size:12px;color:var(--muted)}.cols{grid-template-columns:1.4fr 1fr;margin-bottom:18px}.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.card h2{font-size:16px;color:var(--green);margin:0}.sub{font-size:12px;color:var(--muted)}.linkbtn{border:0;background:transparent;color:var(--green2);font-weight:700;font-size:12px}.notice{background:#f5f0e3;border:1px solid #e9dfc9;border-radius:12px;padding:16px;margin:12px 0}.notice b{color:var(--green)}.notice p{margin:5px 0 0;color:#69766d;font-size:13px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;color:var(--muted);font-size:11px;font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line)}.table td{padding:12px 8px;border-bottom:1px solid #f0ede6}.pill{font-size:11px;border-radius:30px;padding:4px 9px;background:#edf2ed;color:#315b43;white-space:nowrap}.pill.gold{background:#f5efdf;color:#8c6d32}.pill.red{background:#f9e9e6;color:#a04b3e}.event{display:flex;gap:13px;padding:12px 0;border-bottom:1px solid var(--line)}.event:last-child{border:0}.day{background:#f3efe5;border-radius:10px;min-width:46px;text-align:center;padding:7px;color:var(--green)}.day b{display:block;font-size:18px}.event b{font-size:13px}.event small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.btn{border:0;border-radius:9px;background:var(--green);color:white;padding:10px 15px;font-weight:650}.btn:hover{background:var(--green2)}.btn.secondary{background:#f0ede4;color:var(--green)}.btn.gold{background:var(--gold);color:#fff}.btn.small{font-size:12px;padding:7px 10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.pagehead h1{font:500 29px Georgia;color:var(--green);margin:0}.toolbar{display:flex;gap:9px;margin-bottom:15px;flex-wrap:wrap}.field{border:1px solid var(--line);border-radius:9px;background:white;padding:9px 11px;min-width:170px;color:var(--ink)}.fulltable{overflow:auto}.resourcegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.resource{min-height:145px}.resource .symbol{font-size:24px;color:var(--gold)}.resource h3{font:500 19px Georgia;color:var(--green);margin:12px 0 5px}.resource p{font-size:12px;color:var(--muted);margin:0}.message{padding:13px 0;border-bottom:1px solid var(--line)}.message b{font-size:13px}.message p{margin:4px 0;color:var(--muted);font-size:12px}.modalback{position:fixed;inset:0;background:#0c1d17a8;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal{background:var(--paper);border-radius:16px;padding:24px;width:min(520px,100%);box-shadow:0 20px 80px #0003}.modal h2{font:500 24px Georgia;color:var(--green);margin:0 0 15px}.modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}.modal input,.modal textarea,.modal select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:white}.modal textarea{min-height:90px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.mobilehead{display:none}

.nav button{display:flex;align-items:center;gap:10px}.nav-ar{display:block;font-size:10px;opacity:.72;direction:rtl;margin-top:2px;font-weight:500}
.islamic-hero{background:linear-gradient(120deg,#123d32,#24634f);color:#fff;border-radius:14px;padding:22px;margin-bottom:16px}.islamic-hero h2{font:500 25px Georgia;margin:4px 0}.islamic-hero p{color:#e5eee9;margin:5px 0}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}.calendar-cell{border:1px solid var(--line);border-radius:9px;min-height:76px;padding:7px;background:#fff}.calendar-cell.today{border:2px solid var(--gold);background:#fbf7eb}.calendar-cell small{display:block;color:var(--muted);font-size:10px}.calendar-head{font-size:11px;text-align:center;color:var(--muted);font-weight:700}.arabic{font-family:Georgia,serif;direction:rtl}.feature-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.feature-row:last-child{border:0}.progress{height:8px;background:#eee9df;border-radius:20px;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:var(--gold);border-radius:20px}.tag{font-size:10px;padding:4px 8px;border-radius:20px;background:#f3efe5;color:var(--green)}
@media(max-width:900px){.sidebar{width:210px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.resourcegrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.app{display:block}.sidebar{width:100%;padding:12px;display:block}.brand{padding:0 5px}.navlabel,.sidebottom{display:none}.nav{display:flex;overflow:auto;margin-top:12px}.nav button{white-space:nowrap;padding:8px 10px;font-size:12px}.topbar{height:57px;padding:0 15px}.content{padding:20px 14px}.welcome{display:block}.date{display:inline-block;margin-top:12px}.stats{gap:9px}.card{padding:14px}.stat strong{font-size:23px}.resourcegrid{grid-template-columns:1fr}.role{max-width:145px;font-size:12px}.welcome h1{font-size:27px}}

.pathway{display:inline-flex;gap:6px;padding:5px 9px;border-radius:20px;background:#eef2ed;color:#315b43;font-size:11px}.pathway.hifz{background:#f5efdf;color:#8c6d32}.pathway.foundation{background:#eaf0f6;color:#355b7b}.quran-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.quran-form label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.quran-form input,.quran-form select,.quran-form textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:white}.quran-form .wide{grid-column:1/-1}.record{padding:12px 0;border-bottom:1px solid var(--line)}.auth-note{background:#fff7e7;border:1px solid #eadbb8;padding:13px;border-radius:10px;color:#69532c;font-size:12px}@media(max-width:650px){.quran-form{grid-template-columns:1fr}.quran-form .wide{grid-column:auto}}
</style></head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><div class="mark">۞</div><div><strong>AS-SALAAM CONNECT</strong><small>Madrasat As-Salaam</small></div></div>
<div><div class="navlabel">Workspace</div><nav class="nav" id="nav"></nav></div>
<div class="sidebottom">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ<br><br>Learning with purpose. Growing with adab.</div></aside>
<main class="main"><header class="topbar"><div class="crumb" id="crumb">School portal / Overview</div><div class="topright"><select class="role" id="role"><option>Student</option><option>Parent</option><option>Teacher</option><option>Administrator</option></select><div class="avatar" id="avatar">S</div></div></header><div class="content" id="content"></div></main></div>
<div class="modalback" id="modalback"><div class="modal"><h2 id="modtitle">New item</h2><div id="modbody"></div><div class="modalfoot"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" id="saveModal">Save demo item</button></div></div></div>
<script>
const menus={
Student:[["Overview","⌂"],["My attendance","◷"],["My Qur'an progress","📖"],["My results","▤"],["Learning library","✧"],["Quizzes","✓"],["Challenges","☆"],["School calendar","▦"],["Messages","✉"],["Report a concern","⚑"]],
Parent:[["Overview","⌂"],["My children","♧"],["Children's Qur'an progress","📖"],["Attendance & absences","◷"],["Results","▤"],["Learning library","✧"],["School calendar","▦"],["Messages","✉"]],
Teacher:[["Overview","⌂"],["My students","♧"],["Daily attendance","◷"],["Qur'an progress","📖"],["Results","▤"],["Messages","✉"],["Concerns inbox","⚑"],["School calendar","▦"]],
Administrator:[["Overview","⌂"],["Students & families","♧"],["Account provisioning","🔐"],["Qur'an progress","📖"],["Teachers","♙"],["Attendance","◷"],["Results","▤"],["Messages","✉"],["Safeguarding concerns","⚑"],["School calendar","▦"],["Challenges & quizzes","☆"],["Daily inspiration","✧"],["Learning library","▤"]]
};
Object.keys(menus).forEach(r=>{["Islamic calendar","Announcements","Settings"].forEach((p)=>{if(!menus[r].some(x=>x[0]===p))menus[r].push([p,p==="Islamic calendar"?"☾":p==="Announcements"?"▣":"⚙"]);});if(r==="Student"&&!menus[r].some(x=>x[0]==="Achievements"))menus[r].push(["Achievements","★"]);});
let role="Student",page="Overview",extraMessages=[],concerns=[],absences=[],events=[],announcements=[];
const sampleStudents=[["Yusuf Ahmed","Year 8","Ustadh Hamza","Present"],["Maryam Khan","Year 7","Ustadh Hamza","Present"],["Ibrahim Ali","Year 9","Ustadh Bilal","Absent"],["Aisha Rahman","Year 8","Ustadh Hamza","Present"]];
const nav=document.getElementById("nav"),content=document.getElementById("content");
function setRole(v){role=v;page="Overview";document.getElementById("role").value=v;document.getElementById("avatar").textContent=v[0];render()}
document.getElementById("role").onchange=e=>setRole(e.target.value);
function go(p){page=p;render()}
function btn(t,fn,cls=""){return `<button class="btn ${cls}" onclick="${fn}">${t}</button>`}
function openModal(title,fields,save){document.getElementById("modtitle").textContent=title;document.getElementById("modbody").innerHTML=fields;document.getElementById("modalback").style.display="flex";document.getElementById("saveModal").onclick=()=>{save();closeModal();render()}}
function closeModal(){document.getElementById("modalback").style.display="none"}
function stat(label,value,symbol,foot){return `<div class="card"><div class="stat"><span>${label}</span><div class="symbol">${symbol}</div></div><strong>${value}</strong><span>${foot}</span></div>`}
function table(headers,rows){return `<div class="fulltable"><table class="table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
function overview(){
let stats=role==="Administrator"?[["Students","248","♧","Across all classes"],["Teachers","18","♙","Teaching staff"],["Attendance today","94%","◷","School-wide"],["Open concerns",String(concerns.length+2),"⚑","Restricted access"]]:role==="Teacher"?[["My students","24","♧","Assigned class"],["Present today","22","✓","Attendance"],["Awaiting results","6","▤","Term 4"],["Messages","4","✉","Unread"]]:role==="Parent"?[["Linked children","2","♧","Your family"],["Attendance","96%","◷","This term"],["New results","2","▤","Recently published"],["Messages","3","✉","From school"]]:[["Attendance","96%","◷","This term"],["Learning progress","72%","✧","Your activities"],["Quiz points","340","☆","Keep learning"],["Upcoming events","2","▦","School calendar"]];
let welcome=role==="Student"?"Assalamu alaikum, Yusuf":role==="Parent"?"Assalamu alaikum, family":role==="Teacher"?"Assalamu alaikum, Ustadh Hamza":"Assalamu alaikum, administrator";
return `<div class="welcome"><div><div class="eyebrow">MADRASAT AS-SALAAM · TERM 4</div><h1>${welcome}</h1><p>May Allah place barakah in your learning and efforts today.</p></div><div class="date">Tuesday, 10 November 2026</div></div>
<div class="grid stats">${stats.map(s=>stat(...s)).join("")}</div>
<div class="grid cols"><section class="card"><div class="cardhead"><h2>${role==="Student"?"Your learning at a glance":role==="Parent"?"Your children's overview":role==="Teacher"?"Class overview":"School overview"}</h2><button class="linkbtn" onclick="go('${role==="Student"?"My attendance":role==="Parent"?"My children":role==="Teacher"?"My students":"Students & families"}')">View details →</button></div>
${role==="Student"?`<div class="notice"><b>Today's reminder</b><p>Seeking beneficial knowledge is an act of worship when accompanied by sincerity and action. Keep your intention renewed.</p><small>Source: Qur'an 20:114 (supplication to increase in knowledge)</small></div><h2 style="margin:18px 0 8px">Your week</h2>${table(["Subject","Next lesson","Progress"],[["Qur'an","Wednesday","On track"],["Aqeedah","Thursday","On track"],["Arabic","Friday","Needs revision"]])}`:table(["Name","Class / role","Status"],(role==="Administrator"?sampleStudents:sampleStudents.slice(0,3)).map(s=>[s[0],s[1],`<span class="pill ${s[3]==="Absent"?"red":""}">${s[3]}</span>`]))}</section>
<section class="card"><div class="cardhead"><h2>Upcoming events</h2><button class="linkbtn" onclick="go('School calendar')">Calendar →</button></div>
${[["12","Qur'an recitation circle","Wednesday · 10:30 AM"],["16","Parent-teacher meetings","Monday · 3:30 PM"],...events.map((e,i)=>["+",e.title,e.date])].map(e=>`<div class="event"><div class="day"><b>${e[0]}</b><small>NOV</small></div><div><b>${e[1]}</b><small>${e[2]}</small></div></div>`).join("")}</section></div>
<div class="grid cols"><section class="card"><div class="cardhead"><h2>Quick actions</h2></div><div class="actions">${role==="Parent"?btn("Notify absence","absenceModal()"):role==="Teacher"?btn("Mark attendance","go('Daily attendance')"):role==="Administrator"?btn("Add school event","eventModal()"):btn("Continue learning","go('Learning library')")} ${btn("Open messages","go('Messages')","secondary")} ${role==="Student"?btn("Report a concern","go('Report a concern')","secondary"):""}</div></section><section class="card"><h2>Message of the day</h2><div class="notice"><b>وَقُل رَّبِّ زِدْنِي عِلْمًا</b><p>“My Lord, increase me in knowledge.”</p><small>Qur'an · Surah Taha 20:114</small></div></section></div>`;
}
function pageBody(){
if(page==="Overview")return overview();
if(page==="My attendance"||page==="Attendance & absences"||page==="Daily attendance"||page==="Attendance"){
let isParent=role==="Parent",isTeacher=role==="Teacher"||role==="Administrator";
return `<div class="pagehead"><h1>${page}</h1>${isParent?btn("Submit absence","absenceModal()"):isTeacher?btn("Record attendance","attendanceModal()"):""}</div><div class="card"><div class="cardhead"><h2>${isParent?"Linked children attendance":isTeacher?"Class attendance register":"Your attendance record"}</h2><span class="pill">Term 4 · Demo data</span></div>${table(["Student","Date","Status","Details"],sampleStudents.slice(0,isParent?2:4).map(s=>[s[0],"10 Nov 2026",`<span class="pill ${s[3]==="Absent"?"red":""}">${s[3]}</span>`,s[3]==="Absent"?"Awaiting parent explanation":"—"]).concat(absences.map(a=>[a.child,a.date,`<span class="pill gold">Absence notified</span>`,a.reason])))}</div><p class="sub" style="margin-top:12px">${isParent?"Only a parent/guardian account can submit an absence notification.": "Attendance is entered by the teacher or authorised administrator."}</p>`;
}
if(page.includes("Results"))return `<div class="pagehead"><h1>${page}</h1></div><div class="card"><div class="cardhead"><h2>Term 4 learning results</h2><span class="pill">Sample results</span></div>${table(["Subject","Achievement","Teacher feedback"],[["Qur'an","Achieved","Consistent recitation practice"],["Aqeedah","Merit","Strong understanding of core concepts"],["Arabic","Achieved","Continue vocabulary revision"],["Fiqh","Excellence","Excellent application and reasoning"]])}</div>`;
if(page.includes("library")||page==="Learning library")return `<div class="pagehead"><h1>Islamic learning library</h1><span class="pill">Public learning area</span></div><p class="sub" style="margin-bottom:18px">Explore structured learning resources from foundational knowledge to advanced revision. Content requires source verification and school review before publication.</p><div class="grid resourcegrid">${[["✧","Aqeedah","Foundations of belief and tawheed."],["☾","Seerah","The life and guidance of the Prophet ﷺ."],["▤","Fiqh","Worship, manners and everyday rulings."],["❋","Du'a","Supplications with Arabic, meaning and sources."],["◇","Hadith","Hadith texts, explanations and grading."],["⌘","Islamic history","Prophets, Sahabah and scholars."]].map(x=>`<div class="card resource"><div class="symbol">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><button class="linkbtn" onclick="alert('Demo library: lesson content will be added after source review.')">Explore resources →</button></div>`).join("")}</div>`;
if(page==="Report a concern"||page.includes("concerns"))return `<div class="pagehead"><h1>${page}</h1>${role==="Student"?btn("Submit a concern","concernModal()"):""}</div>${role==="Student"?`<div class="card"><h2>A safe way to speak up</h2><p class="sub">You can send a concern with your name or anonymously. For urgent danger, contact a trusted adult or emergency services immediately. Anonymous reporting does not guarantee that identity can never be inferred from circumstances.</p>${btn("Write a concern","concernModal()")}</div>`:`<div class="card"><h2>Restricted safeguarding inbox</h2><p class="sub">Only authorised safeguarding staff should access identifying details. This demo does not provide secure or anonymous reporting.</p>${table(["Reference","Concern","Visibility","Status"],concerns.map((c,i)=>["SC-"+(100+i),c.text,c.anonymous?"Anonymous":"Named","New"]))}</div>`}`;
if(page==="Messages")return `<div class="pagehead"><h1>Messages</h1>${btn("New message","messageModal()")}</div><div class="card"><h2>Inbox</h2>${[["School office","Term 4 calendar update","Yesterday"],["Ustadh Hamza","A reminder about this week's lesson","Monday"],["Parent group","Parent meeting details","Friday"],...extraMessages.map(m=>[m.to,m.text,"Just now"])].map(m=>`<div class="message"><b>${m[0]}</b><p>${m[1]}</p><span class="sub">${m[2]}</span></div>`).join("")}</div>`;
if(page==="School calendar")return `<div class="pagehead"><h1>School calendar</h1>${role==="Administrator"?btn("Add event","eventModal()"):""}</div><div class="card"><h2>November 2026</h2>${[["12","Qur'an recitation circle","Wednesday · 10:30 AM"],["16","Parent-teacher meetings","Monday · 3:30 PM"],["20","Knowledge challenge closes","Friday · 4:00 PM"],...events.map(e=>["+ ",e.title,e.date])].map(e=>`<div class="event"><div class="day"><b>${e[0]}</b><small>NOV</small></div><div><b>${e[1]}</b><small>${e[2]}</small></div></div>`).join("")}</div>`;
if(page==="Challenges"||page==="Challenges & quizzes"||page==="Quizzes")return `<div class="pagehead"><h1>${page}</h1>${role==="Administrator"?btn("Create challenge","challengeModal()"):""}</div><div class="grid cols"><div class="card"><h2>Fajr consistency challenge</h2><p class="sub">A voluntary student challenge focused on building a consistent routine. Participation is private and encouragement-based.</p><div class="notice"><b>Active campaign · Demo</b><p>Sign up to see the challenge in your student portal.</p></div>${role==="Student"?btn("Join challenge","alert('You joined the demo challenge!')"):""}</div><div class="card"><h2>Knowledge quiz</h2><p class="sub">A short revision quiz for this week's learning.</p>${btn("Start sample quiz","quizModal()")}</div></div>`;
if(page==="Students & families"||page==="My students"||page==="My children"||page==="Teachers")return `<div class="pagehead"><h1>${page}</h1>${role==="Administrator"&&page==="Students & families"?btn("Add student + parent","studentModal()"):role==="Administrator"&&page==="Teachers"?btn("Add teacher","teacherModal()"):""}</div><div class="card"><div class="cardhead"><h2>${page}</h2><input class="field" placeholder="Search demo records" oninput="filterRows(this.value)"></div><div id="studenttable">${table(["Student","Year","Main teacher","Today"],sampleStudents.map(s=>[s[0],s[1],s[2],`<span class="pill ${s[3]==="Absent"?"red":""}">${s[3]}</span>`]))}</div></div>`;
if(page==="Daily inspiration")return `<div class="pagehead"><h1>Daily inspiration</h1>${btn("Add reminder","inspirationModal()")}</div><div class="card"><h2>Review queue</h2><p class="sub">Religious content should be source-checked and approved before publishing.</p><div class="notice"><b>Qur'an 20:114</b><p>“My Lord, increase me in knowledge.”</p><span class="pill gold">Approved sample</span></div></div>`;

if(page==="Islamic calendar")return islamicCalendar();

}

function hijriParts(date,locale="en"){try{return new Intl.DateTimeFormat(locale+"-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"}).format(date)}catch(e){return "Hijri date unavailable in this browser"}}
function islamicCalendar(){let now=new Date(2026,10,10),first=new Date(now.getFullYear(),now.getMonth(),1),days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),offset=first.getDay(),cells="";for(let i=0;i<offset;i++)cells+="<div></div>";for(let d=1;d<=days;d++){let dt=new Date(now.getFullYear(),now.getMonth(),d);cells+=`<div class="calendar-cell ${d===10?"today":""}"><b>${d}</b><small>${hijriParts(dt)}</small>${d===12?"<small>Qur'an circle</small>":d===16?"<small>Parent meetings</small>":""}</div>`}return `<div class="pagehead"><h1>Islamic calendar · التقويم الهجري</h1>${role==="Administrator"?btn("Add school event","eventModal()"):""}</div><div class="islamic-hero"><span class="tag" style="background:#ffffff22;color:white">Umm al-Qura reference · Preview</span><h2>${hijriParts(now)}</h2><p class="arabic">${hijriParts(now,"ar")}</p><p>Tuesday, 10 November 2026 · School events and Islamic dates together</p></div><div class="grid cols"><div class="card"><div class="cardhead"><h2>November 2026 · نوفمبر</h2><span class="tag">Gregorian + Hijri</span></div><div class="calendar-grid">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="calendar-head">${x}</div>`).join("")}${cells}</div><p class="sub" style="margin-top:12px">Hijri dates use browser Umm al-Qura calendar support where available. Observance dates may differ by local moon sighting and school policy.</p></div><div class="card"><h2>Important Islamic occasions</h2>${[["Ramadan","رمضان","Fasting, Qur'an and community"],["Eid al-Fitr","عيد الفطر","Celebration after Ramadan"],["Dhul Hijjah","ذو الحجة","The first ten days and Hajj"],["Eid al-Adha","عيد الأضحى","Sacrifice and generosity"],["Islamic New Year","رأس السنة الهجرية","Beginning of Muharram"]].map(x=>`<div class="feature-row"><div><b>${x[0]}</b><small class="sub arabic">${x[1]}</small><small class="sub">${x[2]}</small></div><span class="tag">School calendar</span></div>`).join("")}</div></div><div class="card" style="margin-top:14px"><div class="cardhead"><h2>School events · فعاليات المدرسة</h2>${role==="Administrator"?btn("Manage events","eventModal()"):""}</div>${[["12","Qur'an recitation circle","Wednesday · 10:30 AM"],["16","Parent-teacher meetings","Monday · 3:30 PM"],["20","Knowledge challenge closes","Friday · 4:00 PM"],...events.map(e=>["+",e.title,e.date])].map(e=>`<div class="event"><div class="day"><b>${e[0]}</b><small>NOV</small></div><div><b>${e[1]}</b><small>${e[2]}</small></div></div>`).join("")}</div>`}
function announcementModal(){openModal("New announcement",`<label>Title</label><input id="antitle" placeholder="Announcement title"><label>Audience</label><select id="anaudience"><option>All school</option><option>Students</option><option>Parents</option><option>Teachers</option></select><label>Message</label><textarea id="anbody" placeholder="Write the announcement"></textarea>`,()=>announcements.push({title:document.getElementById("antitle").value,audience:document.getElementById("anaudience").value,body:document.getElementById("anbody").value}))}

function quizModal(){openModal("Knowledge check",`<p>Which surah contains the supplication “My Lord, increase me in knowledge”?</p><label>Choose an answer</label><select id="qans"><option>Al-Fatihah</option><option>Ta-Ha</option><option>Al-Ikhlas</option></select>`,()=>alert(document.getElementById("qans").value==="Ta-Ha"?"Correct — Qur'an 20:114.":"Not quite. The answer is Surah Ta-Ha, 20:114."))}

render();
// V4 pathway-aware Qur'an learning and family account provisioning preview.
const PATHWAYS={foundation:{label:"Learning to Read",ar:"تعلم القراءة"},reading:{label:"Qur'an Reading from Mushaf",ar:"قراءة القرآن من المصحف"},hifz:{label:"Hifz / Memorisation",ar:"حفظ القرآن"}};
const studentMeta={"Yusuf Ahmed":{pathway:"reading",parent:"Amina Ahmed"},"Maryam Khan":{pathway:"hifz",parent:"Khalid Khan"},"Ibrahim Ali":{pathway:"foundation",parent:"Fatima Ali"},"Aisha Rahman":{pathway:"reading",parent:"Omar Rahman"}};
let quranRecords=JSON.parse(localStorage.getItem("asSalaamQuranRecords")||"[]"),provisionedAccounts=JSON.parse(localStorage.getItem("asSalaamProvisionedDemo")||"[]"),provisionedTeachers=JSON.parse(localStorage.getItem("asSalaamTeachersDemo")||"[]");
function saveLocal(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#39;"}[c]))}
function pathwayBadge(k){let p=PATHWAYS[k]||PATHWAYS.reading;return `<span class="pathway ${k==="hifz"?"hifz":k==="foundation"?"foundation":""}">${p.label} · <span class="arabic">${p.ar}</span></span>`}
function quranRecordHtml(r){let d=r.pathway==="foundation"?`Skill: ${esc(r.skill||"—")} · Level: ${esc(r.level||"—")}`:r.pathway==="hifz"?`New memorisation: ${esc(r.newFrom||"—")} → ${esc(r.newTo||"—")} · Revision: ${esc(r.revision||"—")}`:`Reading: ${esc(r.from||"—")} → ${esc(r.to||"—")} · Tajweed: ${esc(r.tajweed||"—")}`;return `<div class="record"><div class="feature-row"><div><b>${esc(r.student)}</b><small class="sub">${esc(r.date)} · ${PATHWAYS[r.pathway]?.label||"Qur'an"}</small></div><span class="pill">${esc(r.attendance)}</span></div><p class="sub">${d}</p>${r.feedback?`<p class="sub">Teacher: ${esc(r.feedback)}</p>`:""}</div>`}
function updateQuranFields(){let n=document.getElementById("qStudent")?.value,k=studentMeta[n]?.pathway||"reading";document.getElementById("qPathway").innerHTML=pathwayBadge(k);let el=document.getElementById("quranFields");if(k==="foundation")el.innerHTML=`<div class="quran-form"><div><label>Reading skill / المهارة</label><select id="qSkill"><option>Letter recognition</option><option>Letter sounds & pronunciation</option><option>Joining letters</option><option>Reading words</option><option>Short sentences</option></select></div><div><label>Lesson / level</label><input id="qLevel" placeholder="e.g. Book 1, lesson 8"></div></div>`;else if(k==="hifz")el.innerHTML=`<div class="quran-form"><div><label>New memorisation — from / الجديد من</label><input id="qNewFrom" placeholder="Surah and ayah"></div><div><label>New memorisation — to / إلى</label><input id="qNewTo" placeholder="Surah and ayah"></div><div class="wide"><label>Revision / المراجعة</label><input id="qRevision" placeholder="Surah and ayah range revised"></div></div>`;else el.innerHTML=`<div class="quran-form"><div><label>Starting point / من</label><input id="qFrom" placeholder="Surah and ayah"></div><div><label>Finishing point / إلى</label><input id="qTo" placeholder="Surah and ayah"></div><div class="wide"><label>Tajweed / التجويد</label><select id="qTajweed"><option>Excellent</option><option>Good</option><option>Needs practice</option><option>Not assessed today</option></select></div></div>`}
function saveQuranLesson(){let n=document.getElementById("qStudent").value,a=document.getElementById("qAttendance").value,k=studentMeta[n]?.pathway||"reading",r={student:n,attendance:a,pathway:k,date:new Date().toISOString().slice(0,10),feedback:document.getElementById("qFeedback").value};if(a!=="Absent"&&a!=="Excused"){if(k==="foundation"){r.skill=document.getElementById("qSkill").value;r.level=document.getElementById("qLevel").value}else if(k==="hifz"){r.newFrom=document.getElementById("qNewFrom").value;r.newTo=document.getElementById("qNewTo").value;r.revision=document.getElementById("qRevision").value}else{r.from=document.getElementById("qFrom").value;r.to=document.getElementById("qTo").value;r.tajweed=document.getElementById("qTajweed").value}}sampleStudents.find(s=>s[0]===n)[3]=a;quranRecords.push(r);saveLocal("asSalaamQuranRecords",quranRecords);alert("Demo record saved in this browser.");render()}
function quranPathwayPage(){
  let teacher=role==="Teacher"||role==="Administrator",parent=role==="Parent";
  let visibleStudents=role==="Teacher"?sampleStudents.filter(s=>s[2]==="Ustadh Hamza"):role==="Parent"?sampleStudents.slice(0,2):role==="Student"?sampleStudents.slice(0,1):sampleStudents;
  let records=quranRecords.slice().reverse().filter(r=>visibleStudents.some(s=>s[0]===r.student));
  if(teacher){
    let options=visibleStudents.map(s=>'<option>'+esc(s[0])+'</option>').join("");
    return `<div class="pagehead"><h1>Daily Qur'an progress · متابعة القرآن</h1><span class="pill">Teacher register</span></div><div class="card"><h2>Record today's lesson</h2><p class="sub">Attendance and Qur'an progress are recorded together.</p><div class="quran-form"><div><label>Student</label><select id="qStudent" onchange="updateQuranFields()">${options}</select></div><div><label>Attendance</label><select id="qAttendance"><option>Present</option><option>Absent</option><option>Late</option><option>Excused</option></select></div><div class="wide"><label>Assigned pathway</label><div id="qPathway">${pathwayBadge(studentMeta[visibleStudents[0]?.[0]]?.pathway||"reading")}</div></div><div class="wide" id="quranFields"></div><div class="wide"><label>Teacher feedback / ملاحظات المعلم</label><textarea id="qFeedback" placeholder="Progress, corrections, revision advice..."></textarea></div><div class="wide"><button class="btn" onclick="saveQuranLesson()">Save attendance & Qur'an progress</button></div></div><p class="sub">Absent or excused students receive an attendance entry only; do not record a lesson that did not take place.</p></div><div class="card" style="margin-top:15px"><h2>Recent lesson records</h2>${records.length?records.map(quranRecordHtml).join(""):'<p class="sub">No lesson records yet.</p>'}</div>`;
  }
  let children=sampleStudents.slice(0,parent?2:1).map(s=>'<div class="feature-row"><b>'+esc(parent?s[0]:"Your class")+'</b>'+pathwayBadge(studentMeta[s[0]]?.pathway||"reading")+'</div>').join("");
  return `<div class="pagehead"><h1>${page} · تقدم القرآن</h1></div><div class="card"><h2>Assigned learning pathway</h2><p class="sub">The class assigned by the administrator determines the progress tracker.</p>${children}</div><div class="card" style="margin-top:15px"><h2>Lesson history · سجل الدروس</h2>${records.length?records.map(quranRecordHtml).join(""):'<p class="sub">Teacher-recorded Quran lessons will appear here.</p>'}</div>`;
}
function generateTempPassword(){let chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@$%",a=new Uint32Array(20);crypto.getRandomValues(a);return Array.from(a,x=>chars[x%chars.length]).join("")}
function studentModal(){openModal("Add student & linked parent (demo)",`<label>Student full name</label><input id="sname" placeholder="Student name"><label>Parent / guardian name</label><input id="pname" placeholder="Parent name"><label>Parent email (login)</label><input id="pemail" type="email" placeholder="parent@example.com"><label>Student login ID</label><input id="slogin" placeholder="Generated if blank"><label>Year level</label><input id="syear" placeholder="Year 8"><label>Qur'an pathway / الصف</label><select id="spath"><option value="foundation">Learning to Read — تعلم القراءة</option><option value="reading" selected>Qur'an Reading from Mushaf — قراءة القرآن من المصحف</option><option value="hifz">Hifz / Memorisation — حفظ القرآن</option></select><label>Main teacher</label><input id="steacher" placeholder="Teacher name"><div class="auth-note">This browser preview creates no real login. Production creates two linked accounts with separate identities and a one-time temporary password.</div>`,()=>{let n=document.getElementById("sname").value.trim();if(!n){alert("Student name is required.");return}let login=(document.getElementById("slogin").value.trim()||n.toLowerCase().replace(/[^a-z0-9]+/g,".")),pass=generateTempPassword(),k=document.getElementById("spath").value,pn=document.getElementById("pname").value.trim(),email=document.getElementById("pemail").value.trim();sampleStudents.push([n,document.getElementById("syear").value||"—",document.getElementById("steacher").value||"Unassigned","Present"]);studentMeta[n]={pathway:k,parent:pn};provisionedAccounts.push({student:n,parent:pn,parentEmail:email,studentLogin:login,pathway:k});saveLocal("asSalaamProvisionedDemo",provisionedAccounts);setTimeout(()=>alert("DEMO CREDENTIALS — save securely now\nStudent login: "+login+"\nParent login: "+email+"\nShared temporary password: "+pass+"\n\nNo real accounts were created."),40)})}
function accountProvisioningPage(){return `<div class="pagehead"><h1>Account provisioning · إدارة الحسابات</h1>${btn("Add student + parent","studentModal()")}</div><div class="auth-note">Preview only: records are stored in this browser. Production account creation must happen in a Supabase Edge Function; never expose the service-role key in the website.</div><div class="card" style="margin-top:14px"><h2>Provisioned demo families</h2>${provisionedAccounts.length?table(["Student","Parent","Student login","Qur'an class"],provisionedAccounts.map(a=>[esc(a.student),esc(a.parent||"—"),esc(a.studentLogin),PATHWAYS[a.pathway]?.label||"—"])):'<p class="sub">No families added yet.</p>'}</div><div class="card" style="margin-top:14px"><h2>Production sign-in workflow</h2><ol><li>Administrator creates the student and parent profile.</li><li>Server generates a strong temporary password.</li><li>Two separate accounts are created and linked to the same student.</li><li>Each receives its own login ID and the initial password.</li><li>Each account must set its own new password at first sign-in.</li><li>Administrators can trigger resets, but cannot view existing passwords.</li></ol></div>`}
const priorPageBody=pageBody;pageBody=function(){if(["Qur'an progress","My Qur'an progress","Children's Qur'an progress"].includes(page))return quranPathwayPage();if(page==="Account provisioning")return accountProvisioningPage();return priorPageBody()};const priorRender=render;render=function(){priorRender();if(page==="Qur'an progress"&&(role==="Teacher"||role==="Administrator"))updateQuranFields()};


// V5: teacher account provisioning preview and clearer class-based workflows.
function teacherModal(){openModal("Add teacher account (demo)",`<label>Teacher full name</label><input id="tname" placeholder="Ustadh / Ustadha name"><label>Teacher email (login)</label><input id="temail" type="email" placeholder="teacher@school.org"><div class="auth-note">A strong temporary password is generated and shown once in this demo. Production sends account creation to a protected Supabase Edge Function. The administrator cannot retrieve the password later.</div>`,()=>{let name=document.getElementById("tname").value.trim(),email=document.getElementById("temail").value.trim().toLowerCase();if(!name||!email){alert("Teacher name and email are required.");return}let pass=generateTempPassword();provisionedTeachers.push({name,email});saveLocal("asSalaamTeachersDemo",provisionedTeachers);setTimeout(()=>alert("DEMO TEACHER CREDENTIALS — save securely now\nTeacher: "+name+"\nLogin: "+email+"\nTemporary password: "+pass+"\n\nNo real account was created."),40)})}
const priorProvisioningPage=accountProvisioningPage;accountProvisioningPage=function(){let base=priorProvisioningPage();return base+`<div class="card" style="margin-top:14px"><div class="cardhead"><h2>Teacher accounts</h2>${btn("Add teacher","teacherModal()")}</div>${provisionedTeachers.length?table(["Teacher","Login"],provisionedTeachers.map(t=>[esc(t.name),esc(t.email)])):'<p class="sub">No teacher accounts added in this browser preview.</p>'}</div><div class="auth-note" style="margin-top:14px"><b>Credential rule:</b> Parent and student receive the same initial temporary password for their separate accounts. Both must change it on first sign-in. The administrator sees the generated password once during creation; the platform must never store or reveal passwords afterwards.</div>`};


const v5PriorPageBody=pageBody;pageBody=function(){
  if(page==="Teachers"&&role==="Administrator"){
    let rows=provisionedTeachers.map(t=>[esc(t.name),esc(t.email),"<span class=\"pill\">Provisioned in this demo</span>"]);
    return `<div class="pagehead"><h1>Teachers · المعلمون</h1>${btn("Add teacher account","teacherModal()")}</div><div class="card"><h2>Teacher accounts</h2>${rows.length?table(["Teacher","Login","Status"],rows):'<p class="sub">No teacher accounts have been added in this preview.</p>'}</div><p class="sub">In production, teachers are assigned to student groups by the administrator. They can only view and record progress for their assigned students.</p>`;
  }
  if(page==="My students"&&role==="Teacher"){
    let assigned=sampleStudents.filter(s=>s[2]==="Ustadh Hamza");
    return `<div class="pagehead"><h1>My students · طلابي</h1></div><div class="card"><h2>Assigned students</h2>${table(["Student","Year","Qur'an pathway","Today"],assigned.map(s=>[esc(s[0]),esc(s[1]),pathwayBadge(studentMeta[s[0]]?.pathway||"reading"),`<span class="pill ${s[3]==="Absent"?"red":""}">${esc(s[3])}</span>`]))}</div>`;
  }
  return v5PriorPageBody();
};
